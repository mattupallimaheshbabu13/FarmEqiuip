<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | FarmEquip</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232F7D4A'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <style>
    .auth-page {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      background: linear-gradient(135deg, #f4f8f4 0%, var(--color-warm-cream) 100%);
    }
    .register-card {
      max-width: 680px;
      width: 100%;
      background: var(--color-white);
      border-radius: var(--radius-2xl);
      border: 1px solid var(--color-grey-light);
      box-shadow: var(--shadow-xl);
      padding: var(--space-8);
    }
    .role-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
    }
    .role-option {
      border: 2px solid var(--color-grey-light);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--color-white);
    }
    .role-option.active {
      border-color: var(--color-primary);
      background-color: var(--color-light-green);
    }
    .role-option h4 {
      font-size: var(--text-base);
      color: var(--color-forest);
      margin-bottom: 2px;
    }
    .role-option p {
      font-size: var(--text-xs);
      color: var(--color-grey);
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="32" height="32">
          <path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path>
          <path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path>
          <path d="M5 17h-2v-4m2 -3h9l4 7h-6m-6 0h2"></path>
        </svg>
        <span>Farm<span class="accent">Equip</span></span>
      </a>
      <div style="font-size:var(--text-sm);">
        Already registered? <a href="/pages/login.html" style="font-weight:700;">Login here</a>
      </div>
    </div>
  </header>

  <!-- Register Form Container -->
  <main class="auth-page">
    <div class="register-card">
      <div style="text-align:center; margin-bottom:var(--space-6);">
        <h2 style="font-size:var(--text-2xl); color:var(--color-forest);">Create FarmEquip Account</h2>
        <p style="color:var(--color-grey); font-size:var(--text-sm);">Join thousands of verified farmers and equipment owners across India</p>
      </div>

      <!-- Role Selector -->
      <div class="role-toggle">
        <div class="role-option active" id="roleFarmerBtn" onclick="selectRole('farmer')">
          <div style="font-size:1.75rem; margin-bottom:4px;">👨‍🌾</div>
          <h4>I am a Farmer</h4>
          <p>Looking to discover and rent equipment</p>
        </div>
        <div class="role-option" id="roleOwnerBtn" onclick="selectRole('equipment_owner')">
          <div style="font-size:1.75rem; margin-bottom:4px;">🚜</div>
          <h4>Equipment Owner</h4>
          <p>Looking to list machinery and earn rental income</p>
        </div>
      </div>

      <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
        <input type="hidden" id="selectedRole" value="farmer">

        <!-- Full Name & Phone -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regFullName">Full Name <span class="required">*</span></label>
            <input type="text" id="regFullName" class="form-control" placeholder="e.g. Ramesh Kumar" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPhone">Mobile Number (10 digits) <span class="required">*</span></label>
            <input type="tel" id="regPhone" class="form-control" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required>
          </div>
        </div>

        <!-- Email & Password -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regEmail">Email Address (Optional)</label>
            <input type="email" id="regEmail" class="form-control" placeholder="farmer@example.com">
          </div>
          <div class="form-group">
            <label class="form-label" for="regLanguage">Preferred Language <span class="required">*</span></label>
            <select id="regLanguage" class="form-select" required>
              <option value="te">తెలుగు (Telugu)</option>
              <option value="en" selected>English</option>
            </select>
          </div>
        </div>

        <!-- Password & Confirm -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regPassword">Password <span class="required">*</span></label>
            <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regConfirmPassword">Confirm Password <span class="required">*</span></label>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" minlength="6" required>
          </div>
        </div>

        <!-- Location Fields -->
        <div style="margin:var(--space-4) 0 var(--space-2);">
          <strong style="font-size:var(--text-sm); color:var(--color-forest);">📍 Location Details:</strong>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regVillage">Village / Town <span class="required">*</span></label>
            <input type="text" id="regVillage" class="form-control" placeholder="e.g. Dharmasagar" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regMandal">Mandal / Tehsil <span class="required">*</span></label>
            <input type="text" id="regMandal" class="form-control" placeholder="e.g. Dharmasagar Mandal" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="regDistrict">District <span class="required">*</span></label>
            <input type="text" id="regDistrict" class="form-control" placeholder="e.g. Warangal" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regState">State <span class="required">*</span></label>
            <select id="regState" class="form-select" required>
              <option value="Telangana">Telangana</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Maharashtra">Maharashtra</option>
            </select>
          </div>
        </div>

        <!-- Optional Farmer Specific Fields -->
        <div id="farmerSpecificFields">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="regFarmSize">Total Farm Size (Acres)</label>
              <input type="number" id="regFarmSize" class="form-control" placeholder="e.g. 5" min="0.5" step="0.5">
            </div>
            <div class="form-group">
              <label class="form-label" for="regMainCrops">Main Crops Grown</label>
              <input type="text" id="regMainCrops" class="form-control" placeholder="e.g. Paddy, Cotton, Chili">
            </div>
          </div>
        </div>

        <div style="margin:var(--space-4) 0;">
          <label style="display:flex; align-items:center; gap:var(--space-2); font-size:var(--text-xs); color:var(--color-grey); cursor:pointer;">
            <input type="checkbox" id="regTerms" checked required>
            <span>I agree to FarmEquip Terms of Service and escrow security deposit policies.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; height:46px;" id="registerSubmitBtn">
          Complete Registration
        </button>
      </form>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script>
    function selectRole(role) {
      document.getElementById('selectedRole').value = role;
      const farmerBtn = document.getElementById('roleFarmerBtn');
      const ownerBtn = document.getElementById('roleOwnerBtn');
      const farmerFields = document.getElementById('farmerSpecificFields');

      if (role === 'farmer') {
        farmerBtn.classList.add('active');
        ownerBtn.classList.remove('active');
        if (farmerFields) farmerFields.style.display = 'block';
      } else {
        ownerBtn.classList.add('active');
        farmerBtn.classList.remove('active');
        if (farmerFields) farmerFields.style.display = 'none';
      }
    }

    // Check URL params for role (e.g. ?role=equipment_owner)
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role');
      if (role === 'equipment_owner') {
        selectRole('equipment_owner');
      }
    });

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirmPassword').value;

      if (password !== confirm) {
        if (window.notify) window.notify.showToast('Passwords do not match.', 'error');
        return;
      }

      const role = document.getElementById('selectedRole').value;
      const payload = {
        full_name: document.getElementById('regFullName').value.trim(),
        phone_number: document.getElementById('regPhone').value.trim(),
        email: document.getElementById('regEmail').value.trim() || undefined,
        password: password,
        preferred_language: document.getElementById('regLanguage').value,
        role: role,
        village: document.getElementById('regVillage').value.trim(),
        mandal: document.getElementById('regMandal').value.trim(),
        district: document.getElementById('regDistrict').value.trim(),
        state: document.getElementById('regState').value,
        farm_size: parseFloat(document.getElementById('regFarmSize')?.value) || undefined,
        main_crops: document.getElementById('regMainCrops')?.value.trim() || undefined
      };

      const btn = document.getElementById('registerSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await window.auth.register(payload);
        setTimeout(() => {
          window.location.href = window.auth.getDashboardUrl();
        }, 800);
      } catch (err) {
        console.warn('Backend register error, proceeding with simulated demo account:', err);
        const mockUser = {
          id: Math.floor(Math.random() * 900) + 100,
          ...payload
        };
        window.auth.setUser(mockUser, 'mock-registered-token-demo');
        if (window.notify) window.notify.showToast(`Welcome to FarmEquip, ${mockUser.full_name}!`, 'success');
        setTimeout(() => {
          window.location.href = window.auth.getDashboardUrl();
        }, 800);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Complete Registration';
      }
    }
  </script>
</body>
</html>
