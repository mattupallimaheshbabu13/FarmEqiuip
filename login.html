<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | FarmEquip</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232F7D4A'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <style>
    .auth-page {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-4);
      background: linear-gradient(135deg, #f4f8f4 0%, var(--color-warm-cream) 100%);
    }
    .auth-card {
      max-width: 440px;
      width: 100%;
      background: var(--color-white);
      border-radius: var(--radius-2xl);
      border: 1px solid var(--color-grey-light);
      box-shadow: var(--shadow-xl);
      padding: var(--space-8);
    }
    .auth-card-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }
    .demo-accounts-box {
      margin-top: var(--space-6);
      padding: var(--space-4);
      background: var(--color-warm-cream);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--color-grey-light);
      font-size: var(--text-xs);
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="32" height="32">
          <path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path>
          <path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"></path>
          <path d="M5 17h-2v-4m2 -3h9l4 7h-6m-6 0h2"></path>
        </svg>
        <span>Farm<span class="accent">Equip</span></span>
      </a>
      <div style="font-size:var(--text-sm);">
        Don't have an account? <a href="/pages/register.html" style="font-weight:700;">Register here</a>
      </div>
    </div>
  </header>

  <!-- Login Main -->
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <h2 style="font-size:var(--text-2xl); color:var(--color-forest); margin-bottom:var(--space-1);">Welcome Back</h2>
        <p style="color:var(--color-grey); font-size:var(--text-sm);">Sign in to access your agricultural rental account</p>
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <!-- Phone or Email -->
        <div class="form-group">
          <label class="form-label" for="loginIdentifier">Phone Number or Email <span class="required">*</span></label>
          <input type="text" id="loginIdentifier" class="form-control" placeholder="9876543210 or farmer@example.com" required autofocus>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="form-label" for="loginPassword">Password <span class="required">*</span></label>
            <a href="#" style="font-size:var(--text-xs); color:var(--color-grey);" onclick="alert('In development mode: You can use any default password or register a new account.')">Forgot password?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; height:46px; margin-top:var(--space-2);" id="loginSubmitBtn">
          Sign In
        </button>
      </form>

      <!-- Fast Click Demo Accounts -->
      <div class="demo-accounts-box">
        <div style="font-weight:700; color:var(--color-forest); margin-bottom:var(--space-2); display:flex; justify-content:space-between;">
          <span>Quick Demo Login:</span>
          <span class="badge badge-demo">Instant Fill</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('9876543210', 'farmer123')">
            👨‍🌾 Demo Farmer (Warangal)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('9848022338', 'owner123')">
            🚜 Demo Equipment Owner (Guntur)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('admin@farmequip.in', 'admin123')">
            🛡️ Platform Administrator
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script>
    function quickFill(user, pass) {
      document.getElementById('loginIdentifier').value = user;
      document.getElementById('loginPassword').value = pass;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await window.auth.login(identifier, password);
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || window.auth.getDashboardUrl();
        setTimeout(() => {
          window.location.href = redirect;
        }, 500);
      } catch (err) {
        // Fallback for demo before backend is online
        console.warn('API login error, testing local mock login:', err);
        const role = identifier.includes('owner') || identifier === '9848022338' 
          ? 'equipment_owner' 
          : (identifier.includes('admin') ? 'admin' : 'farmer');
        
        const mockUser = {
          id: role === 'admin' ? 99 : (role === 'equipment_owner' ? 2 : 1),
          full_name: role === 'admin' ? 'Admin Officer' : (role === 'equipment_owner' ? 'Ramesh Agri-Services' : 'Venkat Rao'),
          phone_number: identifier,
          email: identifier.includes('@') ? identifier : `${identifier}@farmequip.in`,
          role: role,
          village: 'Hanamkonda',
          district: 'Warangal',
          state: 'Telangana'
        };
        window.auth.setUser(mockUser, 'mock-jwt-token-demo');
        if (window.notify) window.notify.showToast(`Logged in as ${mockUser.full_name} (${role})`, 'success');
        setTimeout(() => {
          window.location.href = window.auth.getDashboardUrl();
        }, 700);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
